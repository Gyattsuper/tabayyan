<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 380px; margin: 0; font: 14px/1.6 system-ui, "Segoe UI", Tahoma, sans-serif; color: #16233b; background: #f4f7fb; }
    header { background: #193565; color: #fff; display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
    header img { width: 28px; height: 28px; }
    header h1 { margin: 0; font-size: 18px; }
    main { padding: 12px; }
    textarea { width: 100%; box-sizing: border-box; min-height: 90px; padding: 8px 10px; border: 1.5px solid #dde4ee; border-radius: 8px; font: inherit; resize: vertical; }
    textarea:focus { outline: none; border-color: #40a8e0; }
    button { margin-top: 8px; width: 100%; padding: 8px; border: 0; border-radius: 8px; color: #fff; font: 600 15px system-ui, sans-serif; cursor: pointer;
      background: linear-gradient(90deg, #30d0c8, #40a8e0 55%, #5b60e9); }
    button:disabled { opacity: .6; }
    #out { background: #fff; border-radius: 8px; margin-top: 10px; }
    #out:empty { display: none; }
    .msg { padding: 10px 12px; color: #5d6b82; } .msg.err { color: #c23b3b; }
    footer { padding: 0 12px 10px; font-size: 12px; color: #5d6b82; }
    footer a { color: #193565; }
  </style>
</head>
<body>
  <header><img src="icons/48.png" alt="" /><h1>تبيّن</h1></header>
  <main>
    <textarea id="text" placeholder="الصق آية أو حديثًا، أو حدّد نصًا في الصفحة قبل فتح الإضافة"></textarea>
    <button id="go">تحقّق</button>
    <div id="out"></div>
  </main>
  <footer>لا يُصدر فتاوى. <a href="options.html" target="_blank">الإعدادات</a></footer>
  <script src="render.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
